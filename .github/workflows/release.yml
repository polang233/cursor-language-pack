name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Open VSX (and VS Marketplace if VSCE_PAT is set)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build, attach and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Sync upstream baseline
        run: npm run sync -- --strategy=api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and package
        run: npm run package

      - name: Validate generated manifests
        run: node scripts/validate-dist.mjs

      - name: Check tag matches config.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          configured=$(node -p "require('./config.json').version")
          if [ "$tag" != "$configured" ]; then
            echo "Tag v$tag does not match config.json version $configured" >&2
            exit 1
          fi

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true

      # Open VSX is Cursor's in-app gallery. Repo secret OVSX_PAT must be set
      # (gh secret set OVSX_PAT). Skips when missing so a Release still ships.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT secret is not set; skipping Open VSX publish."
            exit 0
          fi
          npm run publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # VS Marketplace is optional extra listing, not Cursor's search source.
      - name: Publish to VS Marketplace
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT secret is not set; skipping Marketplace publish."
            exit 0
          fi
          npm run publish:vsce
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
